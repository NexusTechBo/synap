map $uri $static_cache_control {
    default "public, max-age=604800";
    /index.html "no-cache";
    ~^/[^/]+\.(?:js|css|woff2?)$ "public, max-age=31536000, immutable";
    ~^/media/ "public, max-age=31536000, immutable";
}

server {
    listen ${PORT};
    root /usr/share/nginx/html;

    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    resolver_timeout 5s;
    set $backend ${BACKEND_URL};

    set_real_ip_from 0.0.0.0/0;
    set_real_ip_from ::/0;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml image/x-icon font/ttf;

    location ^~ /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        gzip off;
        proxy_pass $backend;
        proxy_ssl_server_name on;
        proxy_read_timeout 120s;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location = /ws {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass $backend;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location ~ \.[A-Za-z0-9]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $static_cache_control;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
