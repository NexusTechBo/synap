<app-dialog-frame
  [title]="(staff ? 'staff.formDialog.editTitle' : 'staff.formDialog.createTitle') | translate"
  [subtitle]="staff ? staff.username : ('staff.formDialog.createSubtitle' | translate)"
  (closed)="ref.close()"
>
  <form id="staff-form" [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
    @if (canChangeRole) {
      <fieldset>
        <legend class="field-label">{{ 'staff.formDialog.roleLabel' | translate }}</legend>
        <div class="grid grid-cols-2 gap-2">
          @for (role of roles(); track role.id) {
            <label
              class="flex cursor-pointer items-center justify-center rounded-2xl border-2 py-2.5 text-sm font-bold transition-colors"
              [class]="
                form.controls.role.value === role.id
                  ? 'border-primary bg-white text-primary'
                  : 'border-transparent bg-white/50 text-gray-600'
              "
            >
              <input type="radio" class="sr-only" formControlName="role" [value]="role.id" />
              {{ role.label }}
            </label>
          }
        </div>
      </fieldset>
    }

    <app-form-field [label]="'staff.formDialog.fullNameLabel' | translate" fieldId="staff-name">
      <input
        id="staff-name"
        class="field-input"
        formControlName="name"
        [placeholder]="'staff.formDialog.fullNamePlaceholder' | translate"
        autocomplete="off"
      />
    </app-form-field>

    <div class="grid gap-4 sm:grid-cols-2">
      <app-form-field [label]="'staff.formDialog.emailLabel' | translate" fieldId="staff-email">
        <input
          id="staff-email"
          type="email"
          class="field-input"
          formControlName="email"
          autocomplete="off"
        />
      </app-form-field>
      <app-form-field
        [label]="'staff.formDialog.phoneLabel' | translate"
        fieldId="staff-phone"
        [errorMessages]="phoneErrors()"
      >
        <input
          id="staff-phone"
          type="tel"
          class="field-input"
          formControlName="phoneNumber"
          autocomplete="off"
        />
      </app-form-field>
    </div>

    @if (isDoctor()) {
      <app-form-field
        [label]="'staff.formDialog.specialtyLabel' | translate"
        fieldId="staff-specialty"
        [errorMessages]="specialtyErrors()"
      >
        <app-select
          id="staff-specialty"
          icon="tag"
          [placeholder]="'staff.formDialog.specialtyPlaceholder' | translate"
          formControlName="specialtyId"
          [options]="specialtyOptions()"
        />
      </app-form-field>
    }

    @if (!staff) {
      <div class="grid gap-4">
        <app-form-field
          [label]="'staff.formDialog.ciLabel' | translate"
          fieldId="staff-ci"
          [errorMessages]="ciErrors()"
        >
          <input
            id="staff-ci"
            class="field-input"
            formControlName="ci"
            inputmode="numeric"
            maxlength="10"
            autocomplete="off"
          />
        </app-form-field>
        <app-form-field
          [label]="'staff.formDialog.usernameLabel' | translate"
          fieldId="staff-username"
          [errorMessages]="usernameErrors()"
        >
          <div class="flex items-center gap-1.5">
            <input
              id="staff-username"
              class="field-input min-w-40 flex-1"
              formControlName="username"
              autocomplete="off"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              [placeholder]="'staff.formDialog.usernamePlaceholder' | translate"
            />
            <span class="min-w-0 truncate text-sm font-semibold text-gray-500">{{
              clinicSuffix()
            }}</span>
          </div>
        </app-form-field>
      </div>
    }

    <app-form-field
      [label]="
        (staff ? 'staff.formDialog.newPasswordLabel' : 'staff.formDialog.initialPasswordLabel')
          | translate
      "
      fieldId="staff-password"
      [hint]="staff ? ('staff.formDialog.passwordHint' | translate) : ''"
    >
      <input
        id="staff-password"
        type="password"
        class="field-input"
        formControlName="password"
        autocomplete="new-password"
        [placeholder]="'staff.formDialog.passwordPlaceholder' | translate"
      />
    </app-form-field>

    @if (error(); as message) {
      <app-alert>{{ message }}</app-alert>
    }
  </form>

  <ng-container ngProjectAs="[dialogFooter]">
    <button type="button" class="btn btn-secondary" (click)="ref.close()">
      {{ 'common.cancel' | translate }}
    </button>
    <button type="submit" form="staff-form" class="btn btn-primary" [disabled]="saving()">
      {{
        (saving()
          ? 'staff.formDialog.saving'
          : staff
            ? 'staff.formDialog.saveChanges'
            : 'staff.formDialog.createMember'
        ) | translate
      }}
    </button>
  </ng-container>
</app-dialog-frame>
