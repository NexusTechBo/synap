<app-dialog-frame
  [title]="'availability.exceptionDialog.title' | translate"
  [subtitle]="'availability.exceptionDialog.subtitle' | translate"
  (closed)="ref.close()"
>
  <form id="exception-form" [formGroup]="form" (ngSubmit)="save()" class="space-y-5">
    <app-form-field
      [label]="'availability.exceptionDialog.dateLabel' | translate"
      fieldId="ex-date"
      [errorMessages]="dateErrors()"
    >
      <app-date-picker class="block" id="ex-date" [min]="today" formControlName="date" />
    </app-form-field>

    <label class="flex cursor-pointer items-center gap-3 rounded-2xl bg-white/50 px-4 py-3">
      <input type="checkbox" class="h-4 w-4 accent-primary" formControlName="isFullDayBlock" />
      <span>
        <span class="block text-sm font-bold text-gray-900">{{
          'availability.exceptionDialog.fullDayTitle' | translate
        }}</span>
        <span class="block text-xs text-gray-500">
          {{ 'availability.exceptionDialog.fullDayHint' | translate }}
        </span>
      </span>
    </label>

    @if (!form.controls.isFullDayBlock.value) {
      <div class="grid grid-cols-2 gap-4">
        <app-form-field
          [label]="'availability.exceptionDialog.fromLabel' | translate"
          fieldId="ex-start"
          [linkedErrorId]="rangeInvalid() ? 'ex-end-error' : null"
        >
          <app-time-picker id="ex-start" formControlName="startTime" />
        </app-form-field>
        <app-form-field
          [label]="'availability.exceptionDialog.toLabel' | translate"
          fieldId="ex-end"
          [errorMessages]="endErrors()"
        >
          <app-time-picker id="ex-end" formControlName="endTime" />
        </app-form-field>
      </div>
    }

    <app-form-field
      [label]="'availability.exceptionDialog.reasonLabel' | translate"
      fieldId="ex-reason"
    >
      <input
        id="ex-reason"
        class="field-input"
        formControlName="reason"
        [placeholder]="'availability.exceptionDialog.reasonPlaceholder' | translate"
      />
    </app-form-field>

    <p class="text-xs text-gray-500">
      {{ 'availability.exceptionDialog.activeAppointmentsNotice' | translate }}
    </p>

    @if (error(); as message) {
      <app-alert>{{ message }}</app-alert>
    }
  </form>

  <ng-container ngProjectAs="[dialogFooter]">
    <button type="button" class="btn btn-secondary" (click)="ref.close()">
      {{ 'common.cancel' | translate }}
    </button>
    <button
      #submitButton
      type="submit"
      form="exception-form"
      class="btn btn-primary"
      [disabled]="saving()"
    >
      {{
        (saving() ? 'availability.exceptionDialog.saving' : 'availability.exceptionDialog.block')
          | translate
      }}
    </button>
  </ng-container>
</app-dialog-frame>
