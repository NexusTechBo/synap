<section [id]="anchor" class="scroll-mt-20 py-24">
  <div class="mx-auto max-w-6xl px-4 sm:px-6">
    <div appReveal class="mx-auto max-w-2xl text-center">
      <p class="text-sm font-bold uppercase tracking-wider text-primary">
        {{ 'landing.roles.eyebrow' | translate }}
      </p>
      <h2 class="mt-2 text-3xl font-extrabold tracking-tight sm:text-4xl">
        {{ 'landing.roles.title' | translate }}
      </h2>
    </div>

    <ul class="mt-14 grid gap-5 md:grid-cols-3">
      @for (role of roles; track role.labelKey) {
        <li
          appReveal
          class="rounded-3xl border border-white/80 bg-white/60 p-7 shadow-sm backdrop-blur transition hover:-translate-y-1 hover:shadow-xl hover:shadow-primary/10"
        >
          <span
            class="mb-5 inline-flex items-center gap-2 rounded-full border border-primary/30 px-3 py-1 text-sm font-semibold text-primary"
          >
            <app-ui-icon [name]="role.icon" class="h-4 w-4" />
            {{ role.labelKey | translate }}
          </span>
          <h3 class="text-lg font-bold">{{ role.titleKey | translate }}</h3>
          <p class="mt-1.5 text-sm leading-relaxed text-gray-600">
            {{ role.descriptionKey | translate }}
          </p>
        </li>
      }
    </ul>
  </div>
</section>
