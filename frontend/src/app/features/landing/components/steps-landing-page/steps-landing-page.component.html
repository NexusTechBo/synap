<section [id]="anchor" class="scroll-mt-20 bg-white/60 py-24">
  <div class="mx-auto max-w-6xl px-4 sm:px-6">
    <div appReveal class="mx-auto max-w-2xl text-center">
      <p class="text-sm font-bold uppercase tracking-wider text-primary">
        {{ 'landing.steps.eyebrow' | translate }}
      </p>
      <h2 class="mt-2 text-3xl font-extrabold tracking-tight sm:text-4xl">
        {{ 'landing.steps.title' | translate }}
      </h2>
    </div>
    <ol class="mt-14 grid gap-5 md:grid-cols-3">
      @for (step of steps; track step.titleKey; let i = $index) {
        <li appReveal class="relative rounded-3xl border border-white/80 bg-white p-7 shadow-sm">
          <span
            class="landing-text-gradient mb-4 block text-5xl font-extrabold leading-none"
            aria-hidden="true"
            >{{ i + 1 | number: '2.0-0' }}</span
          >
          <h3 class="text-lg font-bold">{{ step.titleKey | translate }}</h3>
          <p class="mt-1.5 text-sm leading-relaxed text-gray-600">
            {{ step.descriptionKey | translate }}
          </p>
        </li>
      }
    </ol>
  </div>
</section>
