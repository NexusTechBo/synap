<header class="sticky shadow-2xl top-0 z-20 border-b border-gray-900/5 bg-primary backdrop-blur">
  <nav class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
    <a
      routerLink="/"
      class="flex items-center rounded-lg focus-visible:outline-white focus-visible:outline-offset-2"
    >
      <app-pulso-logo variant="negative" [size]="36" />
    </a>

    <ul class="hidden items-center gap-6 text-sm font-semibold text-gray-600 md:flex">
      @for (item of nav; track item.anchor) {
        <li>
          <a
            [href]="'#' + item.anchor"
            class="rounded-sm text-white hover:text-gray-300 focus-visible:outline-white focus-visible:outline-offset-2"
          >
            {{ item.labelKey | translate }}
          </a>
        </li>
      }
    </ul>

    <div class="flex items-center gap-2">
      @if (isLoggedIn()) {
        <a
          [routerLink]="homeUrl"
          class="btn btn-primary btn-sm hover:text-gray-300 text-white focus-visible:outline-white focus-visible:outline-offset-2"
        >
          {{ 'landing.nav.goToDashboard' | translate }}
        </a>
      } @else {
        <a
          routerLink="/login"
          class="btn btn-ghost bg-blue-500 btn-sm hover:text-gray-300 text-white focus-visible:outline-white focus-visible:outline-offset-2"
        >
          {{ 'landing.nav.login' | translate }}
        </a>
        <a
          routerLink="/register"
          class="btn btn-primary btn-sm hover:text-gray-300 text-white focus-visible:outline-white focus-visible:outline-offset-2"
        >
          {{ 'landing.nav.register' | translate }}
        </a>
      }
    </div>
  </nav>
</header>
