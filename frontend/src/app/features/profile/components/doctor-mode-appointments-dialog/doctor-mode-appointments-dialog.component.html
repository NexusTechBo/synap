<app-dialog-frame
  [title]="'profile.doctorMode.appointmentsDialog.title' | translate"
  (closed)="ref.close()"
>
  <p class="text-[15px] leading-relaxed text-gray-600">{{ message() }}</p>

  <label class="field-label mt-5" for="doctor-mode-reason">
    {{ 'profile.doctorMode.appointmentsDialog.reasonLabel' | translate }}
    <span class="text-gray-400">{{
      'profile.doctorMode.appointmentsDialog.reasonOptional' | translate
    }}</span>
  </label>
  <textarea
    id="doctor-mode-reason"
    rows="3"
    class="field-input resize-none"
    [placeholder]="'profile.doctorMode.appointmentsDialog.reasonPlaceholder' | translate"
    [maxLength]="maxLength"
    [value]="reason()"
    (input)="reason.set($any($event.target).value)"
  ></textarea>
  <p
    class="mt-1 text-right text-xs tabular-nums"
    [class]="reason().length >= maxLength - 50 ? 'text-tertiary' : 'text-gray-400'"
  >
    {{ reason().length }}/{{ maxLength }}
  </p>

  <ng-container ngProjectAs="[dialogFooter]">
    <button type="button" class="btn btn-secondary" (click)="ref.close()">
      {{ 'profile.doctorMode.appointmentsDialog.back' | translate }}
    </button>
    <button type="button" class="btn btn-danger" (click)="submit()">
      {{ 'profile.doctorMode.appointmentsDialog.confirmCancel' | translate }}
    </button>
  </ng-container>
</app-dialog-frame>
