<app-dialog-frame
  [title]="
    (patient ? 'patients.formDialog.editTitle' : 'patients.formDialog.createTitle') | translate
  "
  [subtitle]="patient ? patient.name : ('patients.formDialog.createSubtitle' | translate)"
  (closed)="ref.close()"
>
  <form id="patient-form" [formGroup]="form" (ngSubmit)="save()" class="space-y-4">
    <app-form-field [label]="'patients.formDialog.nameLabel' | translate" fieldId="patient-name">
      <input id="patient-name" class="field-input" formControlName="name" autocomplete="off" />
    </app-form-field>

    <div class="grid gap-4 sm:grid-cols-2">
      <app-form-field
        [label]="'patients.formDialog.phoneLabel' | translate"
        fieldId="patient-phone"
        [errorMessages]="phoneErrors"
      >
        <input
          id="patient-phone"
          type="tel"
          class="field-input"
          formControlName="phoneNumber"
          autocomplete="off"
          [placeholder]="phonePlaceholder()"
        />
      </app-form-field>
      <app-form-field
        [label]="'patients.formDialog.emailLabel' | translate"
        fieldId="patient-email"
      >
        <input
          id="patient-email"
          type="email"
          class="field-input"
          formControlName="email"
          autocomplete="off"
        />
      </app-form-field>
    </div>

    <app-form-field
      [label]="'document.optionalLabel.' + country() | translate"
      fieldId="patient-document"
    >
      <input
        id="patient-document"
        class="field-input"
        formControlName="document"
        inputmode="numeric"
        [attr.maxlength]="documentMaxLength"
        autocomplete="off"
        [placeholder]="'document.placeholder.' + country() | translate"
      />
    </app-form-field>

    @if (error(); as message) {
      <app-alert>{{ message }}</app-alert>
    }
  </form>

  <ng-container ngProjectAs="[dialogFooter]">
    <button type="button" class="btn btn-secondary" (click)="ref.close()">
      {{ 'patients.formDialog.cancel' | translate }}
    </button>
    <button type="submit" form="patient-form" class="btn btn-primary" [disabled]="saving()">
      {{
        (saving()
          ? 'patients.formDialog.saving'
          : patient
            ? 'patients.formDialog.saveChanges'
            : 'patients.formDialog.createButton'
        ) | translate
      }}
    </button>
  </ng-container>
</app-dialog-frame>
