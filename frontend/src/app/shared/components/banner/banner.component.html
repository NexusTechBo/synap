<div class="relative h-full p-2">
  <div class="relative h-full overflow-hidden rounded-2xl">
    <img src="images/medical-center.jpg" class="object-cover blur-sm h-full w-full" alt="" />
    <div
      class="absolute inset-0 rounded-2xl bg-linear-to-t from-black/50 via-black/10 to-transparent"
    ></div>
  </div>

  <div class="absolute left-8 top-8">
    <app-pulso-logo variant="positive" [size]="32" />
  </div>

  <div class="absolute inset-2 flex items-center justify-center p-6">
    <div
      class="max-w-md rounded-2xl border border-white/40 bg-white/90 p-8 text-center shadow-2xl shadow-black/20 backdrop-blur-md"
    >
      <div
        class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-primary/10"
      >
        <app-ui-icon name="login" class="h-6 w-6 text-primary" />
      </div>
      <h2 class="mb-2 text-2xl font-bold text-neutral-900">
        {{ 'banner.welcome' | translate }}
      </h2>
      <p class="text-neutral-600">
        {{ 'banner.tagline' | translate }}
      </p>
    </div>
  </div>
</div>
