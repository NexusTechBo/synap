@if (label()) {
  @if (tooltip(); as tooltipText) {
    <div class="mb-1.5 flex items-center gap-1.5">
      <label class="field-label !mb-0" [for]="fieldId()">{{ label() }}</label>
      <app-help-tooltip [text]="tooltipText" />
    </div>
  } @else {
    <label class="field-label" [for]="fieldId()">{{ label() }}</label>
  }
}
<ng-content />
@if (error(); as message) {
  <p class="field-error" [id]="errorId()">{{ message }}</p>
} @else if (hint()) {
  <p class="mt-1.5 text-xs text-gray-500" [id]="hintId()">{{ hint() }}</p>
}
