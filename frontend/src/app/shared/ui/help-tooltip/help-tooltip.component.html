<button
  #trigger
  type="button"
  class="inline-flex h-4 w-4 items-center justify-center rounded-full text-slate-400 transition-colors hover:text-slate-600 focus:text-slate-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/60"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-expanded]="isOpen()"
  [attr.aria-describedby]="isOpen() ? tooltipId : null"
  (mouseenter)="open()"
  (mouseleave)="close()"
  (focus)="open()"
  (blur)="close()"
  (click)="toggle($event)"
>
  <app-ui-icon name="info" class="h-4 w-4" />
</button>

@if (isOpen()) {
  <div
    [id]="tooltipId"
    role="tooltip"
    class="pointer-events-none fixed z-50 w-64 max-w-[calc(100vw-1.5rem)] rounded-lg bg-slate-900 px-3 py-2 text-xs font-normal leading-relaxed text-white shadow-lg"
    [style.top.px]="coords().top"
    [style.left.px]="coords().left"
    [class.-translate-y-full]="coords().placement === 'top'"
  >
    {{ text() }}
  </div>
}
